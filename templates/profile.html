{% extends "base.html" %}
{% block title %}내 프로필 · 스튜디오 소담{% endblock %}
{% block content %}
<h1>내 프로필</h1>
<form method="post" class="grid form-card">
  <label>
    이름
    <input type="text" name="name" value="{{ user.name }}" required />
  </label>
  <label>
    이메일
    <input type="email" value="{{ user.email }}" disabled />
  </label>
  <label>
    새 비밀번호
    <input type="password" name="password" placeholder="변경하지 않으면 비워두세요" />
  </label>
  <button type="submit" class="primary">프로필 저장</button>
</form>
{% endblock %}
