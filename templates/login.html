{% extends "base.html" %}
{% block title %}로그인 · 스튜디오 소담{% endblock %}
{% block content %}
<section class="auth">
  <hgroup>
    <h1>관리자 로그인</h1>
    <p>스튜디오 소담 외주 관리 시스템에 접속하세요.</p>
  </hgroup>
  <form method="post" class="grid">
    <label>
      이메일
      <input type="email" name="email" placeholder="admin@studiosodam.com" required />
    </label>
    <label>
      비밀번호
      <input type="password" name="password" placeholder="비밀번호" required />
    </label>
    <button type="submit" class="primary">로그인</button>
  </form>
  <p class="hint">기본 계정: admin@studiosodam.com / sodam1234</p>
</section>
{% endblock %}
